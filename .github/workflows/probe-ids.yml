name: Probe identifiers (one-off, to be removed)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recallatlas-data
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python probe_ids.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "recall-bot"
          git config user.email "recall-bot@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || git commit -m "Probe identifiers: report (to be removed)"
          git pull --rebase -q && git push
