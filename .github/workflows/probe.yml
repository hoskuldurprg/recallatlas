name: Probe sources (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recallatlas-data
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python probe.py
      - run: |
          git config user.name "recall-bot"
          git config user.email "recall-bot@users.noreply.github.com"
          git add probe
          git diff --cached --quiet || git commit -q -m "Probe AU/NZ sources (samples, to be removed)"
          git pull --rebase -q && git push
