name: Update recalls
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button for manual runs
permissions:
  contents: write   # commit data/
  pages: write      # deploy the site
  id-token: write
concurrency:
  group: recallatlas-data
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python crawl.py
      - name: Remove pages committed by the old setup (no-op once they are gone)
        run: |
          old=$(git ls-files | grep -E '^([a-z]{2}|recalls)/|^(index\.html|sitemap\.xml|robots\.txt)$' | cut -d/ -f1 | sort -u)
          [ -n "$old" ] && git rm -r -q --cached $old && rm -rf $old || true
      - name: Commit new data
        run: |
          git config user.name "recall-bot"
          git config user.email "recall-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Update recalls $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q && git push
      - run: python build_site.py --indexnow
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Post to Bluesky, Mastodon, X and Facebook (dry run until the secrets are set)
        continue-on-error: true   # a social media hiccup must never fail the site update
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          python social.py
          git add data/social
          git diff --cached --quiet || git commit -q -m "Social posts $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q && git push
