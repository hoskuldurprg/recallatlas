name: Update recalls
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button for manual runs
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python crawl.py
      - run: python build_site.py
      - name: Commit new data and pages
        run: |
          git config user.name "recall-bot"
          git config user.email "recall-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update recalls $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
