# Cloudflare Worker for Recall Atlas alerts. The deploy workflow fills in database_id (it creates the database on
# first deploy, in Western Europe) and sets the ALERTS_KEY secret; do not put secrets in this file.
name = "recallatlas-alerts"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "recallatlas-alerts"
database_id = "DATABASE_ID"
